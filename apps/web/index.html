<!doctype html>
<html lang="es" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amautai</title>
    <style>
      #boot-screen { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 16px; margin: 0; background: var(--background, Canvas); color: var(--foreground, CanvasText); font: 500 14px system-ui, sans-serif; }
      body:has(#boot-screen) { margin: 0; }
      #boot-screen img { width: 40px; height: 40px; }
    </style>
    <script>
      ;(() => {
        let theme = "dark"
        try {
          const saved = localStorage.getItem("amautai-theme")
          if (["light", "dark", "system"].includes(saved)) theme = saved
        } catch {}
        const resolved =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme
        document.documentElement.classList.remove("dark", "light")
        document.documentElement.classList.add(resolved)
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"><div id="boot-screen" role="status" aria-live="polite"><img src="/favicon.svg" alt="" /><span>Preparando Amautai…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
