services:
  whatsapp:
    build:
      context: ../..
      dockerfile: apps/whatsapp-gateway/Dockerfile
    image: amautai-whatsapp:local
    container_name: amautai-whatsapp
    restart: unless-stopped
    init: true
    env_file: /opt/amautai-whatsapp-secrets/gateway.env
    volumes:
      - whatsapp-data:/data
    ports:
      - "127.0.0.1:8791:3001"
    networks:
      - proxy
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  whatsapp-data:
networks:
  proxy:
    external: true
    name: proxy
