<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nursery assets · Amautai</title><style>body{margin:0;background:#173e36;color:#fff2cd;font:18px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}button,select{font:inherit;padding:10px;border-radius:8px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}article{background:#294f43;border:1px solid #6b8b68;border-radius:16px;padding:16px}canvas{width:100%;height:230px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#345b4d 0% 25%,#2b4d41 0% 50%) 50%/20px 20px}p{line-height:1.6}</style></head><body><main><header><h1 id="title"></h1><select id="language" aria-label="Idioma"><option value="0">Español</option><option value="1">Chanka Quechua</option><option value="2">Aymara</option></select></header><p id="intro"></p><button id="motion"></button><section id="assets"></section><p id="note"></p></main><script type="module">
const copy=[['El vivero de las decenas · Assets animados','Vista previa de los sprites reales. Las plantas y sus diez espacios se componen en el juego para conservar cantidades exactas.','Pausar animación','Reproducir animación','Cuidador: caminar','Una maceta','Bandeja de diez espacios','Controles del juego: flechas o WASD para caminar, E para recoger, G para agrupar y U para abrir.'],['Chunkakunapa mallki wiñachinan · Kawsachisqa siqikuna','Pukllaypa siqinkunata qaway. Mallkikuna pukllaypi huñukun yupaynin allin kananpaq.','Kawsachisqata samachiy','Kawsachisqata purichiy','Mallki qawaq: puriy','Huk mallki manka','Chunka uchkuyuq apana','Flechakunawan utaq WASD puriy, E huñuy, G huñunaypaq, U kichanaypaq.'],['Tunkanakan panqara uywañapa · Sarnaqiri jamuqanaka','Anatawi jamuqanaka uñjam. Mallkinaka anatawina tantachasi chiqapa jakhuwitaki.','Sarnaqawi saytʼayaña','Sarnaqawi qalltayaña','Mallki uñjiri: sarnaqaña','Mä mallki phuku','Tunka pʼiyani apaña','Flechanakampi jan ukax WASD sarnaqam, E apthapiña, G tantachaña, U jistʼaraña.']]
let language=0,playing=true;const elements=[];const keys=['caretaker','plant','tray'];for(const [i,key]of keys.entries()){const article=document.createElement('article'),label=document.createElement('h2'),canvas=document.createElement('canvas');canvas.width=400;canvas.height=300;article.append(label,canvas);document.querySelector('#assets').append(article);const atlas=await fetch(key+'.json').then(r=>r.json());const img=new Image();img.src=key+'.png';await img.decode();elements.push({label,canvas,img,frames:Object.values(atlas.frames).map(f=>f.frame),i})}
function translate(){const c=copy[language];document.documentElement.lang=['es','quy','ay'][language];document.querySelector('#title').textContent=c[0];document.querySelector('#intro').textContent=c[1];document.querySelector('#motion').textContent=c[playing?2:3];document.querySelector('#note').textContent=c[7];for(const el of elements)el.label.textContent=c[4+el.i]}
document.querySelector('#language').onchange=e=>{language=Number(e.target.value);translate()};document.querySelector('#motion').onclick=()=>{playing=!playing;translate()};const reduced=matchMedia('(prefers-reduced-motion: reduce)');playing=!reduced.matches;translate();function draw(time){for(const el of elements){const f=el.frames[playing?Math.floor(time/145)%el.frames.length:0],ctx=el.canvas.getContext('2d'),scale=Math.min(360/f.w,270/f.h);ctx.clearRect(0,0,400,300);ctx.imageSmoothingEnabled=false;ctx.drawImage(el.img,f.x,f.y,f.w,f.h,(400-f.w*scale)/2,(300-f.h*scale)/2,f.w*scale,f.h*scale)}requestAnimationFrame(draw)}requestAnimationFrame(draw)
</script></body></html>
