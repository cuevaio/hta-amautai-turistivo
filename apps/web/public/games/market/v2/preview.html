<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Route · Pixel asset gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#122e32;color:#f9f0dc;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:0 0 8px}p{color:#d0dfd7;max-width:760px}button{font:inherit;border:1px solid #8cac9b;background:#21454a;color:inherit;border-radius:12px;padding:10px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px}article{border:1px solid #47716d;border-radius:16px;overflow:hidden;background:#1b3e42}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:repeating-conic-gradient(#e8e3cd 0 25%,#d6d9c4 0 50%) 50%/24px 24px}h2{font-size:18px;margin:12px 16px 4px}small{display:block;margin:0 16px 16px;color:#c4ddd0}.error{color:#ffc1ad}
</style></head><body><main><h1>The Market Route · Animated pixel assets</h1><p>Four-frame transport and vendor loops, readable single-item foods, and an open crate for tens. Original transparent PNGs are preserved. No gameplay requests or score changes are made by this gallery.</p><button id="toggle" type="button">Pause animation</button><div class="grid" id="gallery"></div></main><script type="module">
const assets=[['tricycle','Coast · Cargo tricycle',true],['llama','Highlands · Pack llama',true],['peque-peque','Jungle · Peque-peque',true],['market-stall','Welcoming market vendor',true],['fish','One whole fish',false],['corn','One corn cob',false],['banana','One banana',false],['crate','One crate · ten items',false]];
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches;const toggle=document.querySelector('#toggle');function label(){toggle.textContent=running?'Pause animation':'Play animation';toggle.setAttribute('aria-pressed',String(running))}toggle.onclick=()=>{running=!running;label()};label();
for(const [key,title,animated] of assets){const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=600;canvas.height=600;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',title);card.append(canvas);const h=document.createElement('h2');h.textContent=title;card.append(h);const note=document.createElement('small');note.textContent=animated?'4-frame transparent sprite sheet · 5 fps':'Transparent inventory icon';card.append(note);document.querySelector('#gallery').append(card);
try{const atlas=await(await fetch(key+'-atlas.json')).json();const picture=new Image();picture.src=key+(animated?'-sheet':'')+'.png';await picture.decode();const frames=Object.values(atlas.frames);const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;let step=0,last=0;
function draw(time){if(running&&time-last>200){step=(step+1)%frames.length;last=time}const f=frames[step].frame;context.clearRect(0,0,600,600);const scale=Math.min(520/f.w,500/f.h);context.drawImage(picture,f.x,f.y,f.w,f.h,Math.round((600-f.w*scale)/2),Math.round((600-f.h*scale)/2),Math.round(f.w*scale),Math.round(f.h*scale));requestAnimationFrame(draw)}requestAnimationFrame(draw)
}catch(error){note.textContent='Asset is not available yet.';note.className='error'}}
</script></body></html>
