<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La feria del equilibrio</title>
<style>body{margin:0;background:#102e29;color:#fff2cf;font:17px system-ui}main{max-width:1060px;margin:auto;padding:24px}h1{font-size:32px}button{padding:12px 18px;border:1px solid #b9c899;border-radius:12px;background:#f9edcf;color:#173c34;font:inherit;cursor:pointer}nav{display:flex;gap:12px;flex-wrap:wrap}.scene{position:relative;margin:24px 0;aspect-ratio:3/2;background:url(coast.png) center/cover;border-radius:20px;overflow:hidden}.helper{position:absolute;left:38%;bottom:15%;width:140px;height:204px;background:url(helper.png) 0 0/560px 204px;image-rendering:pixelated;animation:walk .65s steps(4) infinite}.basket{position:absolute;width:20%;left:12%;bottom:25%;animation:receive 2s ease-in-out infinite}.basket.second{left:auto;right:12%;animation-delay:1s}.tray{display:flex;gap:18px;flex-wrap:wrap}.tray img{height:80px;object-fit:contain}.paused *{animation-play-state:paused!important}@keyframes walk{to{background-position:-560px 0}}@keyframes receive{0%,80%,100%{transform:translateY(0) scale(1)}90%{transform:translateY(-8px) scale(1.04)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:600px){main{padding:16px}.helper{width:84px;height:122.4px;background-size:336px 122.4px;animation-name:small}@keyframes small{to{background-position:-336px 0}}}</style>
<main><h1 data-t="La feria del equilibrio">La feria del equilibrio</h1><p data-t="Camina con las flechas o WASD. También puedes tocar una estación.">Camina con las flechas o WASD. También puedes tocar una estación.</p><nav><button data-lang="es-PE">Español</button><button data-lang="quy-PE">Quechua chanka</button><button data-lang="ay-PE">Aimara</button></nav><nav style="margin-top:12px"><button data-region="coast" data-t="Costa">Costa</button><button data-region="highlands" data-t="Sierra">Sierra</button><button data-region="jungle" data-t="Selva">Selva</button><button id="pause">Pausar animación</button></nav><section class="scene"><img class="basket" src="basket.png" alt="Pedido fijo" data-alt="Pedido fijo"><img class="basket second" src="basket.png" alt="Tu pedido" data-alt="Tu pedido"><div class="helper" role="img" aria-label="Ayudante de la feria" data-label="Ayudante de la feria"></div></section><div class="tray"><img src="../../market/v2/fish.png" alt="Pescado" data-alt="Pescado"><img src="../../market/v2/corn.png" alt="Maíz" data-alt="Maíz"><img src="../../market/v2/banana.png" alt="Plátano" data-alt="Plátano"></div><a href="/panel/salas" style="color:#e8d49d" data-t="Ver salas">Ver salas</a></main><script>
const messages={"es-PE":{"La feria del equilibrio":"La feria del equilibrio","Camina con las flechas o WASD. También puedes tocar una estación.":"Camina con las flechas o WASD. También puedes tocar una estación.","Costa":"Costa","Sierra":"Sierra","Selva":"Selva","Pausar animación":"Pausar animación","Reproducir animación":"Reproducir animación","Pedido fijo":"Pedido fijo","Tu pedido":"Tu pedido","Ayudante de la feria":"Ayudante de la feria","Pescado":"Pescado","Maíz":"Maíz","Plátano":"Plátano","Ver salas":"Ver salas"},"quy-PE":{"La feria del equilibrio":"Kaqlla yupaykunapa qhatun","Camina con las flechas o WASD. También puedes tocar una estación.":"Wachikunawan utaq WASD puriy. Huk sayanatapas llachpayta atinki.","Costa":"Chala","Sierra":"Sallqa","Selva":"Sacha","Pausar animación":"Kawsachisqata samachiy","Reproducir animación":"Kawsachisqata purichiy","Pedido fijo":"Mana tikraq mañakuy","Tu pedido":"Mañakuyniyki","Ayudante de la feria":"Qhatupa yanapaqnin","Pescado":"Challwa","Maíz":"Sara","Plátano":"Platanu","Ver salas":"Pukllana wasikunata qaway"},"ay-PE":{"La feria del equilibrio":"Kikipa jakhunakan qhatupa","Camina con las flechas o WASD. También puedes tocar una estación.":"Wach'inakampi jan ukax WASD sarnaqam. Mä chiqawja llamkt'arakismawa.","Costa":"Quta thaya","Sierra":"Qullu suyu","Selva":"Chʼumi","Pausar animación":"Sarnaqawi saytʼayaña","Reproducir animación":"Sarnaqawi qalltayaña","Pedido fijo":"Jan mayjt'iri mayita","Tu pedido":"Mayitama","Ayudante de la feria":"Qhatun yanapiripa","Pescado":"Chawlla","Maíz":"Tunqu","Plátano":"Latanu","Ver salas":"Anatañ utanaka uñjaña"}};
let locale='es-PE';const scene=document.querySelector('.scene');
function localize(){const m=messages[locale];document.documentElement.lang=locale;document.title=m['La feria del equilibrio'];for(const el of document.querySelectorAll('[data-t]'))el.textContent=m[el.dataset.t];for(const el of document.querySelectorAll('[data-alt]'))el.alt=m[el.dataset.alt];for(const el of document.querySelectorAll('[data-label]'))el.setAttribute('aria-label',m[el.dataset.label]);document.querySelector('#pause').textContent=m[scene.classList.contains('paused')?'Reproducir animación':'Pausar animación']}
for(const b of document.querySelectorAll('[data-lang]'))b.onclick=()=>{locale=b.dataset.lang;localize()};
for(const b of document.querySelectorAll('[data-region]'))b.onclick=()=>scene.style.backgroundImage=`url(${b.dataset.region}.png)`;
document.querySelector('#pause').onclick=()=>{scene.classList.toggle('paused');localize()};localize();
</script></html>
