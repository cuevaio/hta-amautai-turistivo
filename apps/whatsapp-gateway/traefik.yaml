{
  "http": {
    "routers": {
      "amautai-whatsapp": {
        "rule": "Host(`notify.urday.dev`) && PathPrefix(`/amautai-whatsapp/`)",
        "priority": 350,
        "entryPoints": [
          "websecure"
        ],
        "service": "amautai-whatsapp",
        "middlewares": [
          "amautai-whatsapp-strip"
        ],
        "tls": {
          "certResolver": "letsencrypt"
        }
      }
    },
    "middlewares": {
      "amautai-whatsapp-strip": {
        "stripPrefix": {
          "prefixes": [
            "/amautai-whatsapp"
          ]
        }
      }
    },
    "services": {
      "amautai-whatsapp": {
        "loadBalancer": {
          "servers": [
            {
              "url": "http://amautai-whatsapp:3000"
            }
          ]
        }
      }
    }
  }
}
