<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructores del Perú · Amautai</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3e7;color:#173f35;font:16px system-ui}main{max-width:1060px;margin:auto;padding:24px}h1{font-size:clamp(28px,4vw,42px)}p{line-height:1.6}button,a{font:inherit;color:inherit;background:#fffdf6;border:1px solid #c1ba9d;border-radius:12px;padding:12px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap}.stage{height:550px;margin-top:20px;border-radius:24px;overflow:hidden;background:center/cover url('/games/fair/v1/coast.webp');position:relative}.board{position:absolute;inset:50px 5% 30px 25%;background:center/100% 100% url('workbench.webp');border-radius:16px}.guide{position:absolute;width:150px;height:200px;left:2%;bottom:25px;background:url('guide.webp') 0 0/400% 100%;animation:guide 2s steps(4) infinite;image-rendering:pixelated}.house{position:absolute;left:50%;top:48%;width:200px;height:160px;background:#e1ac52;transform:translate(-50%,-30%);box-shadow:0 6px #8c6333}.roof{position:absolute;top:-95px;left:-20px;width:240px;height:100px;background:#d3734e;clip-path:polygon(50% 0,100% 100%,0 100%);animation:snap 2.5s ease-in-out infinite}.window{position:absolute;width:60px;height:60px;top:38px;left:65px;background:#4d968d;border:3px solid #285e55}.paused *{animation-play-state:paused!important}@keyframes guide{to{background-position:133.333% 0}}@keyframes snap{0%,15%{transform:translateY(-50px);opacity:.35}35%,100%{transform:translateY(0);opacity:1}}@media(max-width:600px){.stage{height:500px}.board{inset:30px 5% 100px}.guide{height:144px;width:108px;bottom:0}.house{width:160px;height:130px}.roof{width:200px;left:-20px}.window{left:50px;width:50px;height:50px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><nav aria-label="Idioma"><button data-l="es">Español</button><button data-l="quy">Chanka Quechua</button><button data-l="ay">Aymara</button></nav><h1 id="title"></h1><p id="intro"></p><nav><button data-r="coast"></button><button data-r="highlands"></button><button data-r="jungle"></button><button id="pause"></button></nav><div class="stage"><div class="board"><div class="house"><div class="roof"></div><div class="window"></div></div></div><div class="guide" aria-hidden="true"></div></div><p id="caption"></p><a id="open" href="/panel/salas"></a></main><script>const c={es:['Constructores del Perú','Elige una figura y colócala en el espacio resaltado.','Costa','Sierra','Selva','Pausar animación','Reproducir animación','Galería de assets: guía con cuatro poses, mesa de trabajo y animación de encaje.','Abrir salas de juego'],quy:['Perúpa wasichiqkuna','Huk rikchayta akllay hinaspa llimpisqa kasqanman churay.','Chala','Sallqa','Sach’a','Kawsachisqata samachiy','Kawsachisqata purichiy','Rikchaykuna: tawa kuyuriq yanapaq, llankana misa, churanapaq kuyuriy.','Pukllay qutukunata kichay'],ay:['Perú markan utachirinaka','Mä uñnaqa ajllim ukat qhanstayata chiqar ucham.','Quta thiyäxa','Suni','Ch’umi','Sarnaqawi saytʼayaña','Sarnaqawi qalltayaña','Uñnaqanakapa: pusi sarnaqiri yanapiri, irnaqañ mesa ukat uchawi.','Anatañ utanaka jistʼaraña']};let l='es',paused=false;function render(){const t=c[l];document.documentElement.lang=l;document.getElementById('title').textContent=t[0];document.getElementById('intro').textContent=t[1];document.querySelectorAll('[data-r]').forEach((b,i)=>b.textContent=t[i+2]);document.getElementById('pause').textContent=t[paused?6:5];document.getElementById('caption').textContent=t[7];document.getElementById('open').textContent=t[8]}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{l=b.dataset.l;render()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>document.querySelector('.stage').style.backgroundImage=`url('/games/fair/v1/${b.dataset.r}.webp')`);document.getElementById('pause').onclick=()=>{paused=!paused;document.querySelector('.stage').classList.toggle('paused',paused);render()};render();</script></html>
