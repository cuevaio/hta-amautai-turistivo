{
  "http": {
    "routers": {
      "amautai-whatsapp": {
        "rule": "Host(`wts.urday.dev`)",
        "entryPoints": [
          "websecure"
        ],
        "service": "amautai-whatsapp",
        "tls": {
          "certResolver": "letsencrypt"
        }
      }
    },
    "services": {
      "amautai-whatsapp": {
        "loadBalancer": {
          "servers": [
            {
              "url": "http://amautai-whatsapp:3000"
            }
          ]
        }
      }
    }
  }
}
